; Configuración de PHP para el runtime de Vercel (vercel-php lee este archivo).
; No afecta al entorno local, que corre con el php.ini del contenedor.

; Los avisos de PHP NO van a la pantalla del usuario. Dos motivos:
;
;  1. Filtran rutas internas del servidor (/var/task/user/vendor/...), que es
;     información que no tiene por qué salir del servidor.
;  2. Se imprimen ANTES de que Laravel arme la respuesta, así que en la API
;     rompen el JSON: el cliente recibe texto suelto pegado adelante del
;     cuerpo y el parseo falla sin explicación.
;
; Los errores siguen registrándose: Laravel los escribe en su propio log, y
; Vercel captura la salida de error en los logs de la función.
display_errors = Off
log_errors = On
